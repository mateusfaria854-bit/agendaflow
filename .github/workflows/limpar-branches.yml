name: Limpeza de branches integradas

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  limpar-branch:
    # Executa somente após merge de branch interna ao próprio repositório.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Remover apenas branches temporárias feature/ ou chore/
        uses: actions/github-script@v7
        with:
          script: |
            const name = context.payload.pull_request.head.ref;
            if (!/^(feature|chore)\/[a-zA-Z0-9._\/-]+$/.test(name)) {
              core.info(`Branch não é temporária: ${name}. Ignorando.`);
              return;
            }
            if (name === 'main') {
              core.setFailed('Proteção: main não pode ser excluída.');
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${name}`
              });
              core.info(`Branch removida após merge: ${name}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch já removida ou protegida: ${name}`);
                return;
              }
              throw error;
            }
