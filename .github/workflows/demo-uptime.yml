name: Disponibilidade da demo HTTPS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/demo-uptime.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: agendaflow-demo-uptime
  cancel-in-progress: false

jobs:
  smoke-publico:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEMO_BASE_URL: https://agendaflow-web-production.up.railway.app
    steps:
      - name: Conferir DNS, certificado HTTPS e resposta da API
        shell: bash
        run: |
          set -euo pipefail
          host=agendaflow-web-production.up.railway.app
          getent ahosts "$host"
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            --dump-header /tmp/agendaflow-health-headers \
            "$DEMO_BASE_URL/api/v1/health" -o /tmp/agendaflow-health.json
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/agendaflow-health.json","utf8"));
            const headers=fs.readFileSync("/tmp/agendaflow-health-headers","utf8").toLowerCase();
            if(body.status!=="ok"||body.service!=="agendaflow-api")process.exit(1);
            if(!headers.includes("cache-control: no-store"))process.exit(1);
            if(!headers.includes("strict-transport-security: max-age=15552000"))process.exit(1);
            if(!headers.includes("permissions-policy: camera=(), microphone=(), geolocation=(), payment=()"))process.exit(1);
            console.log("API /health, HSTS e Permissions-Policy OK");
          '
      - name: Conferir conexão efetiva com PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/api/v1/ready" -o /tmp/agendaflow-ready.json
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/agendaflow-ready.json","utf8"));
            if(body.status!=="ready")process.exit(1);
            console.log("Banco PostgreSQL conectado");
          '
      - name: Conferir backup PostgreSQL íntegro nas últimas 36 horas
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/api/v1/backups/ready" -o /tmp/agendaflow-backup-health.json
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/agendaflow-backup-health.json","utf8"));
            if(body.status!=="fresh")process.exit(1);
            console.log("Backup PostgreSQL verificado dentro da janela de 36h");
          '
      - name: Conferir frontend React e asset estático
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/" -o /tmp/agendaflow-home.html
          grep -q '<div id="root"></div>' /tmp/agendaflow-home.html
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/favicon.svg" -o /tmp/agendaflow-icon.svg
          grep -qi '<svg' /tmp/agendaflow-icon.svg
          echo "Frontend e favicon disponíveis"

      - name: Abrir incidente no GitHub quando a demo falhar
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          label=agenda-demo-uptime
          gh label create "$label" -R "$GITHUB_REPOSITORY" --color "B42318" \
            --description "Incidentes de disponibilidade da demonstracao" --force
          issue="$(gh issue list -R "$GITHUB_REPOSITORY" --label "$label" \
            --state open --json number --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -z "$issue" ]]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "AgendaFlow: demonstracao indisponivel" \
              --label "$label" \
              --body "A verificacao externa HTTPS, API, frontend, banco ou backup recente falhou.\n\nExecucao: $run_url\n\nNao incluir dados de clientes neste incidente."
          else
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" \
              --body "Nova falha detectada. Verificar execucao: $run_url"
          fi
      - name: Encerrar incidente quando o servico recuperar
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list -R "$GITHUB_REPOSITORY" \
            --label agenda-demo-uptime --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$issue" -R "$GITHUB_REPOSITORY" \
              --comment "Recuperacao confirmada por HTTPS, frontend, API, PostgreSQL e backup recente. $run_url"
          fi
