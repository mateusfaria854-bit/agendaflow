name: Disponibilidade da demo HTTPS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/demo-uptime.yml'

permissions:
  contents: read

concurrency:
  group: agendaflow-demo-uptime
  cancel-in-progress: false

jobs:
  smoke-publico:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEMO_BASE_URL: https://agendaflow-web-production.up.railway.app
    steps:
      - name: Conferir DNS, certificado HTTPS e resposta da API
        shell: bash
        run: |
          set -euo pipefail
          host=agendaflow-web-production.up.railway.app
          getent ahosts "$host"
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            --dump-header /tmp/agendaflow-health-headers \
            "$DEMO_BASE_URL/api/v1/health" -o /tmp/agendaflow-health.json
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/agendaflow-health.json","utf8"));
            const headers=fs.readFileSync("/tmp/agendaflow-health-headers","utf8").toLowerCase();
            if(body.status!=="ok"||body.service!=="agendaflow-api")process.exit(1);
            if(!headers.includes("cache-control: no-store"))process.exit(1);
            console.log("API /health e cabeçalhos de segurança OK");
          '
      - name: Conferir conexão efetiva com PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/api/v1/ready" -o /tmp/agendaflow-ready.json
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/agendaflow-ready.json","utf8"));
            if(body.status!=="ready")process.exit(1);
            console.log("Banco PostgreSQL conectado");
          '
      - name: Conferir frontend React e asset estático
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/" -o /tmp/agendaflow-home.html
          grep -q '<div id="root"></div>' /tmp/agendaflow-home.html
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            "$DEMO_BASE_URL/favicon.svg" -o /tmp/agendaflow-icon.svg
          grep -qi '<svg' /tmp/agendaflow-icon.svg
          echo "Frontend e favicon disponíveis"
