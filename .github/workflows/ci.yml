name: Qualidade e banco

on:
  push:
  pull_request:

jobs:
  verificacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://agendaflow:agendaflow_local@localhost:5432/agendaflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agendaflow
          POSTGRES_PASSWORD: agendaflow_local
          POSTGRES_DB: agendaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendaflow -d agendaflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências dos workspaces
        run: npm install --no-audit --no-fund
      - name: Verificar especificações, fronteiras e compilação
        run: |
          npm run spec:check
          npm run arch:check
          npm run build
      - name: Aplicar migrações e seed fictício
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed
      - name: Testes unitários e integração da API
        run: npm test
      - name: Verificar integridade das reservas no PostgreSQL
        run: npm run db:verify
