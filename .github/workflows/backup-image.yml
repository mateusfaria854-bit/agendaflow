name: Imagem do backup independente

on:
  push:
    paths:
      - 'ops/backup/**'
      - '.github/workflows/backup-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe e guardrails
        run: |
          bash -n ops/backup/backup.sh
          grep -Fq 'DEMO_MODE' ops/backup/backup.sh
          grep -Fq 'pg_restore' ops/backup/backup.sh
          grep -Fq 'head-object' ops/backup/backup.sh
          grep -Fq 'INSERT INTO backup_verifications' ops/backup/backup.sh
      - name: Testar retenção com inventário fictício, sem acesso S3
        run: |
          python3 -m unittest discover -s ops/backup -p 'test_retention.py' -v
          python3 -m py_compile ops/backup/retention.py
          if grep -E 'aws[^#]*delete-object|aws[^#]*delete-objects' ops/backup/retention.py; then
            echo "Este utilitário não pode incluir comandos de exclusão S3." >&2
            exit 1
          fi
      - name: Compilar imagem isolada com cliente PostgreSQL e S3
        run: docker build -f ops/backup/Dockerfile -t agendaflow-dbbackup:check .
      - name: Garantir que modo sem configuracao falha fechado
        run: |
          if docker run --rm agendaflow-dbbackup:check; then
            echo 'ERRO: job executou sem credenciais.' >&2
            exit 1
          fi
