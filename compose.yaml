# Ambiente local para desenvolvimento. Não usar as credenciais deste arquivo em produção.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendaflow
      POSTGRES_PASSWORD: agendaflow_local
      POSTGRES_DB: agendaflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenda_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendaflow -d agendaflow"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  agenda_pg_data:
